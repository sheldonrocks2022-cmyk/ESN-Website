    <style id="esn-first-paint">
      /* A visible HTML fallback when a browser cannot load the React bundle. */
      html, body { min-height: 100%; }
      body:has(#esn-boot-fallback) { background: #050711; color: #f3f7ff; }
      #esn-boot-fallback { box-sizing: border-box; min-height: 100svh; display: flex;
        align-items: center; justify-content: center; padding: 24px; text-align: center;
        font-family: system-ui, -apple-system, sans-serif; }
      #esn-boot-fallback .esn-boot-panel { max-width: 480px; }
      #esn-boot-fallback .esn-boot-mark { color: #62f1ff; font-size: 1rem; font-weight: 900;
        letter-spacing: .24em; }
      #esn-boot-fallback h1 { margin: 20px 0 10px; font-size: clamp(1.6rem, 6vw, 2.5rem); }
      #esn-boot-fallback p { color: #a8bad5; line-height: 1.6; }
      #esn-boot-fallback a { display: inline-block; margin-top: 16px; padding: 13px 22px;
        border-radius: 12px; background: #1687fa; color: white; font-weight: 750;
        text-decoration: none; }
    </style>
