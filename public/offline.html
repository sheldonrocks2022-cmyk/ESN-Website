<head>

  <title>ES Network • Offline</title>
  <style>
    html,body{margin:0;min-height:100%;background:#050711;color:#f8fbff;font-family:system-ui,sans-serif}

    p{color:#9aa9bc;line-height:1.6}
    button{padding:12px 16px;border-radius:999px;border:1px solid rgba(98,241,255,.24);background:#0c1b31;color:#eefcff;font-weight:800}

<body><main><span>ES NETWORK // OFFLINE</span><h1>Connection lost.</h1><p>The live ESN site needs a network connection for current SMP, Discord, plugin, and website data. Reconnect, then reload.</p><button onclick="location.reload()">Try again</button></main></body>
