name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Sync latest verified ESNSMP JAR
        run: node scripts/fetch-esnsmp.mjs

      - name: Render PNG social previews and icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          node scripts/render-social-assets.mjs
      - name: Scan repository for leaked secrets
        run: npm run security:secrets
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Validate protected routes and links
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Validate built routes
        run: npm run validate:dist
      - name: Upload deployable website
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: esn-website-dist
          path: dist
          retention-days: 14
