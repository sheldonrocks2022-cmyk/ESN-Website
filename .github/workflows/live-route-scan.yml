name: Live Route Scan

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install rendered-page scanner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Scan deployed ESN routes
        run: node scripts/scan-live-routes.mjs

      - name: Upload rendered route scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-route-scan
          path: route-scan-results.json
          if-no-files-found: warn
