name: Publish ESN Website Builder Site

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: esn-site-builder-publish
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.issue.title, '[SITE-BUILD]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout trusted ESN publisher
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate ownership and publish structured site
        run: node .github/scripts/publish-built-site.mjs
